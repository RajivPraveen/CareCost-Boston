name: CareCost checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: carecost demo && carecost --db data/processed/demo.sqlite evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python }}
          path: evaluations/results.json
