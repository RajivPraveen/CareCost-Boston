[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carecost"
version = "0.1.0"
description = "Local-first hospital price comparison and itemized bill review"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.44,<2", "pydeck>=0.9,<1", "pandas>=2.2,<3", "pydantic>=2.10,<3",
  "requests>=2.32,<3", "ijson>=3.3,<4", "pillow>=11,<13", "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
semantic = ["sentence-transformers>=3.4,<6", "faiss-cpu>=1.10,<2"]
ocr = ["pypdfium2>=4.30,<6"]
warehouse = ["snowflake-connector-python[pandas]>=3.13,<5", "dbt-snowflake>=1.9,<2", "python-dotenv>=1,<2"]

[project.scripts]
carecost = "carecost.cli:main"

[tool.setuptools.packages.find]
include = ["carecost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
